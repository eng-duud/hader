name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, Audit, Build & E2E Smoke Tests
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: 'https://hader.ye'
      NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
      SUPABASE_SERVICE_ROLE_KEY: 'placeholder-service-role-key'
      RESEND_API_KEY: 'placeholder-resend-key'
      OWNER_NOTIFICATION_EMAIL: 'admin@hader.ye'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run ESLint
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Step 8 Comprehensive Audit (SEO, A11y, Security, Headers)
        run: pnpm test:step8

      - name: Run Programmatic E2E Smoke Tests
        run: pnpm test:e2e:smoke

      - name: Build Application Bundle
        run: pnpm build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Browser E2E Tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
